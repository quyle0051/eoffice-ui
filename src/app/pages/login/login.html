<div class="login-page">
  <form class="login-card" (ngSubmit)="onSubmit()" #f="ngForm">
    <h1>E-Office</h1>
    <p class="subtitle">Đăng nhập hệ thống văn phòng điện tử</p>

    <label for="email">Email</label>
    <input id="email" name="email" type="email"
           [(ngModel)]="email" required autocomplete="username" />

    <label for="password">Mật khẩu</label>
    <input id="password" name="password" type="password"
           [(ngModel)]="password" required autocomplete="current-password" />

    @if (errorMessage()) {
      <div class="error">{{ errorMessage() }}</div>
    }

    <button type="submit" [disabled]="f.invalid || loading()">
      {{ loading() ? 'Đang đăng nhập...' : 'Đăng nhập' }}
    </button>
  </form>
</div>
