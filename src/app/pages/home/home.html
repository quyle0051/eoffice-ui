<div class="welcome">
  <h2>Xin chào, {{ user()?.email }}</h2>
  <p>{{ today }}</p>
</div>

<h3 class="section-title">Truy cập nhanh</h3>

<div class="tiles">
  @for (t of tiles; track t.link) {
    <a class="tile" [routerLink]="t.link">
      <div class="tile-title">{{ t.title }}</div>
      <div class="tile-desc">{{ t.desc }}</div>
    </a>
  }
</div>
