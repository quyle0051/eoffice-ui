@if (user(); as u) {
  <div class="app" [class.collapsed]="collapsed()">

    <!-- MENU TRÁI  -->
    <aside class="sidebar">
      <div class="brand">E-Office</div>

      <div class="profile">
        <div class="avatar">{{ initial() }}</div>
        <div class="profile-info">
          <div class="profile-name" [title]="u.email">{{ u.email }}</div>
          <div class="profile-role">{{ roleLabel() }}</div>
        </div>
      </div>

      <nav class="menu">
        <!-- Tổng quan -->
        <a class="menu-item" routerLink="/home" routerLinkActive="active">
          <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
          <span>Tổng quan</span>
        </a>

        <!-- Các nhóm menu (lấy từ menu.config.ts) -->
        @for (g of menu(); track g.key) {
          <div class="menu-group" [class.open]="openGroup() === g.key">
            <button type="button" class="menu-item" (click)="toggleGroup(g.key)">
              @switch (g.icon) {
                @case ('file') {
                  <svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
                }
                @case ('task') {
                  <svg viewBox="0 0 24 24"><polyline points="9 11 12 14 22 4"/><path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/></svg>
                }
                @case ('folder') {
                  <svg viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                }
                @case ('shield') {
                  <svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                }
              }
              <span>{{ g.label }}</span>
              <svg class="chevron" viewBox="0 0 24 24"><polyline points="6 9 12 15 18 9"/></svg>
            </button>

            @if (openGroup() === g.key) {
              <div class="submenu">
                @for (c of g.children; track c.link) {
                  <a [routerLink]="c.link" routerLinkActive="active">{{ c.label }}</a>
                }
              </div>
            }
          </div>
        }
      </nav>
    </aside>

    <!--PHẦN BÊN PHẢI -->
    <div class="main">
      <header class="topbar">
        <button type="button" class="icon-btn" (click)="toggleSidebar()" aria-label="Ẩn hoặc hiện menu">
          <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
        </button>

        <div class="quick-actions">
          <a routerLink="/documents/incoming/new">+ Thêm văn bản đến</a>
          <a routerLink="/documents/outgoing/new">+ Thêm văn bản đi</a>
          <a routerLink="/tasks/new">+ Giao việc</a>
        </div>

        <span class="spacer"></span>

        <button type="button" class="logout" (click)="logout()">
          <svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
          Đăng xuất
        </button>
      </header>

      <main class="content">
        <router-outlet />
      </main>
    </div>
  </div>
}
